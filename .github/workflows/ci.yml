name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

env:
  APP_ENV: production

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        NODE_VERSION: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ matrix.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        run: npm install

      - name: Display Environment
        run: echo "Running in $APP_ENV"

      - name: Verify DockerHub Secret
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DockerHub token missing"
            exit 1
          fi
          echo "DockerHub token found"

      - name: Run Tests
        run: npm test

      - name: Upload Build Logs
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: .
          retention-days: 7