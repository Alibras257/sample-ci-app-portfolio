name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

env:
  APP_ENV: production
  IMAGE_NAME: sampleapp

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Display Environment
        run: echo "Environment = $APP_ENV"

      - name: Run Tests
        run: npm test

      - name: Upload Build Logs
        uses: actions/upload-artifact@v5
        with:
          name: build-logs-${{ matrix.node-version }}
          path: .
          retention-days: 7

      - name: Workflow Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Node Version: ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: $APP_ENV" >> $GITHUB_STEP_SUMMARY
          echo "- Tests Passed" >> $GITHUB_STEP_SUMMARY

  docker:
    name: Docker Build & Push

    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Verify DockerHub Secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "Missing DOCKERHUB_USERNAME"
            exit 1
          fi

          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing DOCKERHUB_TOKEN"
            exit 1
          fi

          echo "Secrets detected."

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sampleapp:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sampleapp:${{ github.run_number }}

      - name: Cleanup Docker
        run: docker system prune -af

      - name: Docker Summary
        run: |
          echo "## Docker Build" >> $GITHUB_STEP_SUMMARY
          echo "- Image successfully built." >> $GITHUB_STEP_SUMMARY
          echo "- Image pushed to Docker Hub." >> $GITHUB_STEP_SUMMARY